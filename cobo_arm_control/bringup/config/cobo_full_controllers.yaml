# Combined controller config for cobo_full.launch.py
# Merges diffdrive_arduino (diffbot_controllers.yaml) and cobo_arm_control (cobo_controller.yaml)
# into a single controller_manager configuration.

controller_manager:
  ros__parameters:
    update_rate: 4  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diffbot_base_controller:
      type: diff_drive_controller/DiffDriveController

    cobo_controller:
      type: cobo_arm_control/RobotController

    gpio_controller:
      type: gpio_controllers/GpioCommandController


diffbot_base_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.30
    #wheels_per_side: 1  # actually 2, but both are controlled by 1 signal
    wheel_radius: 0.085

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    use_stamped_vel: false

    linear.x.has_velocity_limits: false
    linear.x.has_acceleration_limits: false
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 2.0
    linear.x.min_velocity: -2.0
    linear.x.max_acceleration: 1.0
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0

    angular.z.has_velocity_limits: false
    angular.z.has_acceleration_limits: false
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.max_acceleration: 1.0
    angular.z.min_acceleration: -1.0
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0


gpio_controller:
  ros__parameters:
    gpios:
      - tower
      - left_arm
      - right_arm
    command_interfaces:
      tower:
        - interfaces:
          - t_c_pump_on
          - t_c_auto_mode
          - t_c_valve_open
          - t_c_calibrate
          - t_c_reset
      right_arm:
        - interfaces:
          - r_c_servo
          - r_c_vacuum_on
          - r_c_attach_mode
          - r_c_lock
          - r_c_reset
          - r_c_distance
      left_arm:
        - interfaces:
          - l_c_door_position
          - l_c_lock
          - l_c_reset
    state_interfaces:
      tower:
        - interfaces:
          - t_s_moving
          - t_s_error
          - t_s_pump_on
          - t_s_auto_mode
          - t_s_valve_open
          - t_s_pressure_level
      right_arm:
        - interfaces:
          - r_s_moving
          - r_s_error
          - r_s_servo
          - r_s_vacuum_on
          - r_s_attach_mode
          - r_s_vacuum_level
          - r_s_attach_status
          - r_s_distance
      left_arm:
        - interfaces:
          - l_s_moving
          - l_s_error
          - l_s_door_position


cobo_controller:
  ros__parameters:
    joints:
      - right_T_J_S0_T_TO_U_SL
      - right_A_J_S1_U_SL_TO_A_L0
      - right_A_J_S1_U_A_L0_TO_L1
      - right_A_J_S1_U_A_L1_TO_L2_B1
      - left_T_J_S0_T_TO_U_SL
      - left_A_J_S1_U_SL_TO_A_L0
      - left_A_J_S1_U_A_L0_TO_L1
      - left_A_J_S1_U_A_L1_TO_L2_B1

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity
